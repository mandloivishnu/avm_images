<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Periodic Table & Indian Mnemonic Tricks | आवर्त सारणी एवं शॉर्ट ट्रिक्स</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #475569;
    --border: #e2e8f0;
    --primary: #1d4ed8;
    --primary-light: #eff6ff;
    --s-bg: #fee2e2; --s-border: #fca5a5; --s-text: #991b1b;
    --p-bg: #fef3c7; --p-border: #fcd34d; --p-text: #92400e;
    --d-bg: #dbeafe; --d-border: #93c5fd; --d-text: #1e40af;
    --f-bg: #dcfce7; --f-border: #86efac; --f-text: #166534;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Devanagari', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
  }
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    color: #fff;
    padding: 16px 14px 14px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18);
  }
  .header-top {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .title-wrap h1 {
    margin: 0;
    font-size: 1.08rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .title-wrap p {
    margin: 2px 0 0;
    font-size: 0.76rem;
    color: #cbd5e1;
  }
  .lang-toggle {
    display: flex;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .lang-btn {
    border: none;
    background: transparent;
    color: #e2e8f0;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .lang-btn.active {
    background: #fff;
    color: #0f172a;
  }
  .nav-tabs {
    max-width: 960px;
    margin: 12px auto 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .tab-btn {
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #f1f5f9;
    padding: 8px 6px;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s ease;
  }
  .tab-btn.active {
    background: #ffffff;
    color: #1e3a8a;
    border-color: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 12px 12px 68px;
  }
  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .search-input-wrap {
    position: relative;
    flex: 1;
  }
  .search-input {
    width: 100%;
    padding: 10px 36px 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.88rem;
    background: #fff;
    color: var(--text);
    font-family: inherit;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
  }
  .clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: #e2e8f0;
    color: #334155;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 0.75rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 10px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-chip.active {
    background: #0f172a;
    color: #fff;
    border-color: #0f172a;
  }
  .filter-chip[data-block="s"].active { background: var(--s-text); border-color: var(--s-text); }
  .filter-chip[data-block="p"].active { background: var(--p-text); border-color: var(--p-text); }
  .filter-chip[data-block="d"].active { background: var(--d-text); border-color: var(--d-text); }
  .filter-chip[data-block="f"].active { background: var(--f-text); border-color: var(--f-text); }

  /* Tricks Cards */
  .trick-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .trick-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .block-badge {
    font-size: 0.7rem;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .badge-s { background: var(--s-bg); color: var(--s-text); border: 1px solid var(--s-border); }
  .badge-p { background: var(--p-bg); color: var(--p-text); border: 1px solid var(--p-border); }
  .badge-d { background: var(--d-bg); color: var(--d-text); border: 1px solid var(--d-border); }
  .badge-f { background: var(--f-bg); color: var(--f-text); border: 1px solid var(--f-border); }
  .group-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
  }
  .trick-banner {
    background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
    border-left: 4px solid var(--primary);
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .trick-main {
    font-size: 1.02rem;
    font-weight: 800;
    color: #0f172a;
  }
  .trick-roman {
    font-size: 0.8rem;
    font-weight: 600;
    color: #1d4ed8;
    margin-top: 2px;
  }
  .trick-alt {
    font-size: 0.74rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .breakdown-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 6px;
  }
  .mini-el {
    border-radius: 10px;
    padding: 6px 5px;
    text-align: center;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: transform 0.12s ease;
  }
  .mini-el:active { transform: scale(0.96); }
  .mini-el .z-num { font-size: 0.65rem; font-weight: 700; opacity: 0.8; }
  .mini-el .sym { font-size: 1.05rem; font-weight: 800; line-height: 1.15; }
  .mini-el .cue { font-size: 0.7rem; font-weight: 600; margin-top: 2px; }
  .el-s { background: var(--s-bg); border-color: var(--s-border); color: var(--s-text); }
  .el-p { background: var(--p-bg); border-color: var(--p-border); color: var(--p-text); }
  .el-d { background: var(--d-bg); border-color: var(--d-border); color: var(--d-text); }
  .el-f { background: var(--f-bg); border-color: var(--f-border); color: var(--f-text); }

  /* Element List View (Android Cards) */
  .el-list-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
    gap: 8px;
  }
  .el-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    cursor: pointer;
  }
  .el-card:active { background: #f8fafc; }
  .el-symbol-box {
    width: 46px;
    height: 46px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 800;
  }
  .el-symbol-box small { font-size: 0.64rem; line-height: 1; }
  .el-symbol-box span { font-size: 1.1rem; line-height: 1.15; }
  .el-info { min-width: 0; flex: 1; }
  .el-name {
    font-size: 0.84rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .el-sub {
    font-size: 0.7rem;
    color: var(--muted);
  }

  /* Classic Periodic Table Grid View */
  .table-hint {
    font-size: 0.75rem;
    color: var(--muted);
    background: #fff;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
    padding: 7px 10px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .ptable-scroll {
    overflow-x: auto;
    background: #fff;
    border-radius: 14px;
    padding: 10px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .ptable-grid {
    display: grid;
    grid-template-columns: repeat(18, minmax(46px, 1fr));
    gap: 4px;
    min-width: 880px;
  }
  .pt-cell {
    border-radius: 7px;
    padding: 4px 3px;
    text-align: center;
    cursor: pointer;
    border: 1px solid transparent;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .pt-cell:hover { filter: brightness(0.96); }
  .pt-cell .pt-z { font-size: 0.58rem; font-weight: 700; opacity: 0.85; }
  .pt-cell .pt-sym { font-size: 0.92rem; font-weight: 800; line-height: 1.1; }
  .pt-cell .pt-nm { font-size: 0.54rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pt-spacer {
    height: 12px;
    grid-column: 1 / -1;
  }
  .pt-label {
    grid-column: 1 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 800;
    color: var(--muted);
    background: #f1f5f9;
    border-radius: 7px;
  }

  /* Modal Bottom Sheet for Android */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    background: #fff;
    width: 100%;
    max-width: 540px;
    border-radius: 20px 20px 0 0;
    padding: 18px 16px 24px;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
    animation: slideUp 0.2s ease-out;
  }
  @media (min-width: 600px) {
    .modal-backdrop { align-items: center; }
    .modal-sheet { border-radius: 20px; }
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .modal-badge {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    flex-shrink: 0;
  }
  .modal-badge .mz { font-size: 0.78rem; }
  .modal-badge .msym { font-size: 1.55rem; line-height: 1.1; }
  .modal-close {
    border: none;
    background: #f1f5f9;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    color: #334155;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .detail-item {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .detail-item label {
    display: block;
    font-size: 0.68rem;
    color: var(--muted);
    font-weight: 700;
  }
  .detail-item span {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--text);
  }
  .modal-trick-box {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .modal-trick-box label {
    display: block;
    font-size: 0.7rem;
    font-weight: 800;
    color: #1d4ed8;
    margin-bottom: 2px;
  }
  .modal-trick-box p {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 700;
    color: #0f172a;
  }
  .empty-state {
    text-align: center;
    padding: 36px 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="title-wrap">
      <h1 id="appTitle">आवर्त सारणी एवं शॉर्ट ट्रिक्स (118 तत्व)</h1>
      <p id="appSub">Periodic Table • Famous Indian Mnemonics (NCERT / JEE / NEET)</p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language toggle">
      <button class="lang-btn active" id="btnHi" onclick="setLang('hi')">हिंदी</button>
      <button class="lang-btn" id="btnEn" onclick="setLang('en')">English</button>
    </div>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn active" id="tabTricks" onclick="switchTab('tricks')">🧠 शॉर्ट ट्रिक्स</button>
    <button class="tab-btn" id="tabCards" onclick="switchTab('cards')">📋 तत्व सूची (118)</button>
    <button class="tab-btn" id="tabGrid" onclick="switchTab('grid')">🔢 आवर्त सारणी</button>
  </div>
</header>

<main>
  <div class="search-bar">
    <div class="search-input-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="तत्व, प्रतीक, परमाणु क्रमांक या ट्रिक खोजें (जैसे: Na, सोडियम, हलीना)..." oninput="onSearchInput()" />
      <button class="clear-btn" id="clearBtn" onclick="clearSearch()" aria-label="Clear">✕</button>
    </div>
  </div>

  <div class="chip-row" id="blockChips">
    <button class="filter-chip active" data-block="all" onclick="setBlock('all')" id="chipAll">सभी ब्लॉक (All)</button>
    <button class="filter-chip" data-block="s" onclick="setBlock('s')">s-Block (वर्ग 1–2)</button>
    <button class="filter-chip" data-block="p" onclick="setBlock('p')">p-Block (वर्ग 13–18)</button>
    <button class="filter-chip" data-block="d" onclick="setBlock('d')">d-Block (Transition)</button>
    <button class="filter-chip" data-block="f" onclick="setBlock('f')">f-Block (Lanthanoids & Actinoids)</button>
  </div>

  <!-- TAB 1: TRICKS -->
  <section id="viewTricks"></section>

  <!-- TAB 2: ELEMENT CARDS -->
  <section id="viewCards" class="hidden">
    <div class="el-list-grid" id="cardsGrid"></div>
  </section>

  <!-- TAB 3: PERIODIC TABLE GRID -->
  <section id="viewGrid" class="hidden">
    <div class="table-hint">
      <span id="gridHintText">👈 बाएँ-दाएँ स्क्रॉल करें और किसी भी तत्व पर टैप करें</span>
      <span>1–118</span>
    </div>
    <div class="ptable-scroll">
      <div class="ptable-grid" id="ptableGrid"></div>
    </div>
  </section>

  <div id="emptyState" class="empty-state hidden">कोई परिणाम नहीं मिला। कृपया दूसरा शब्द खोजें।</div>
</main>

<!-- ELEMENT DETAIL BOTTOM SHEET -->
<div class="modal-backdrop" id="detailModal" onclick="closeModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-top">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="modal-badge" id="mBadge">
          <span class="mz" id="mZ">1</span>
          <span class="msym" id="mSym">H</span>
        </div>
        <div>
          <h2 style="margin:0;font-size:1.12rem;" id="mName">Hydrogen</h2>
          <div style="font-size:0.82rem;color:var(--muted);" id="mSubName">हाइड्रोजन</div>
        </div>
      </div>
      <button class="modal-close" onclick="forceCloseModal()" aria-label="Close">✕</button>
    </div>

    <div class="detail-grid">
      <div class="detail-item">
        <label id="lblMass">परमाणु द्रव्यमान (Atomic Mass)</label>
        <span id="mMass">1.008 u</span>
      </div>
      <div class="detail-item">
        <label id="lblBlockGroup">ब्लॉक / वर्ग / आवर्त</label>
        <span id="mBlockGroup">s-Block • G1 • P1</span>
      </div>
      <div class="detail-item" style="grid-column: 1 / -1;">
        <label id="lblConfig">इलेक्ट्रॉनिक विन्यास (Electronic Config)</label>
        <span id="mConfig" style="font-family: 'Inter', monospace;">1s¹</span>
      </div>
    </div>

    <div class="modal-trick-box" id="mTrickBox">
      <label id="lblTrick">याद रखने की भारतीय ट्रिक (Mnemonic Trick)</label>
      <p id="mTrickText">—</p>
      <div style="font-size:0.78rem;color:#1d4ed8;margin-top:3px;font-weight:600;" id="mTrickRoman"></div>
    </div>
  </div>
</div>

const elBySym = {};
ELEMENTS.forEach(e => { elBySym[e.sym] = e; });

const trickBySym = {};
TRICKS.forEach(t => {
  t.symbols.forEach(sym => {
    if (!trickBySym[sym]) trickBySym[sym] = t;
  });
});

let lang = 'hi';
let activeTab = 'tricks';
let activeBlock = 'all';
let query = '';

const i18n = {

    appSub: 'Complete 118 Elements • Hinglish & Hindi Memory Tricks (NCERT)',
    tabTricks: '🧠 Short Tricks',
    tabCards: '📋 Elements (118)',
    tabGrid: '🔢 Periodic Table',
    searchPh: 'Search element, symbol, atomic no. or trick (e.g., Na, Sodium, Halina)...',

    gridHint: '👈 Scroll horizontally & tap any element for details & trick',

function setLang(newLang) {
  lang = newLang;
  document.getElementById('btnHi').classList.toggle('active', lang === 'hi');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  const t = i18n[lang];
  document.getElementById('appTitle').textContent = t.appTitle;
  document.getElementById('appSub').textContent = t.appSub;
  document.getElementById('tabTricks').textContent = t.tabTricks;
  document.getElementById('tabCards').textContent = t.tabCards;
  document.getElementById('tabGrid').textContent = t.tabGrid;
  document.getElementById('searchInput').placeholder = t.searchPh;
  document.getElementById('chipAll').textContent = t.chipAll;
  document.getElementById('gridHintText').textContent = t.gridHint;
  document.getElementById('emptyState').textContent = t.empty;
  document.getElementById('lblMass').textContent = t.lblMass;
  document.getElementById('lblBlockGroup').textContent = t.lblBlockGroup;
  document.getElementById('lblConfig').textContent = t.lblConfig;
  document.getElementById('lblTrick').textContent = t.lblTrick;
  renderAll();
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabTricks').classList.toggle('active', tab === 'tricks');
  document.getElementById('tabCards').classList.toggle('active', tab === 'cards');
  document.getElementById('tabGrid').classList.toggle('active', tab === 'grid');

  document.getElementById('viewTricks').classList.toggle('hidden', tab !== 'tricks');
  document.getElementById('viewCards').classList.toggle('hidden', tab !== 'cards');
  document.getElementById('viewGrid').classList.toggle('hidden', tab !== 'grid');

  renderAll();
}

function setBlock(block) {
  activeBlock = block;
  document.querySelectorAll('.filter-chip').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.block === block);
  });
  renderAll();
}

function onSearchInput() {
  const inp = document.getElementById('searchInput');
  query = inp.value.trim().toLowerCase();
  document.getElementById('clearBtn').style.display = query ? 'flex' : 'none';
  renderAll();
}

function clearSearch() {
  const inp = document.getElementById('searchInput');
  inp.value = '';
  query = '';
  document.getElementById('clearBtn').style.display = 'none';
  renderAll();
}

function matchesElement(el) {
  if (activeBlock !== 'all' && el.block !== activeBlock) return false;
  if (!query) return true;
  const tr = trickBySym[el.sym];
  const trickText = tr ? `${tr.trick_hi} ${tr.trick_roman} ${tr.alt_trick}` : '';
  const hay = `${el.z} ${el.sym} ${el.en} ${el.hi} ${el.block}-block ${trickText}`.toLowerCase();
  return hay.includes(query);
}

function renderTricks() {
  const container = document.getElementById('viewTricks');
  const filtered = TRICKS.filter(t => {
    if (activeBlock !== 'all' && t.block !== activeBlock) return false;
    if (!query) return true;
    const elNames = t.symbols.map(s => {
      const e = elBySym[s];
      return e ? `${e.z} ${e.sym} ${e.en} ${e.hi}` : s;
    }).join(' ');
    const hay = `${t.group_en} ${t.group_hi} ${t.trick_hi} ${t.trick_roman} ${t.alt_trick} ${elNames}`.toLowerCase();
    return hay.includes(query);
  });

  if (filtered.length === 0) {
    container.innerHTML = '';
    return 0;
  }

  container.innerHTML = filtered.map(t => {
    const title = lang === 'hi' ? t.group_hi : t.group_en;
    const cardsHtml = t.breakdown.map(item => {
      const el = elBySym[item.s];
      const z = el ? el.z : '';
      return `
        <div class="mini-el el-${t.block}" onclick="openDetail('${item.s}')">
          <div class="z-num">${z}</div>
          <div class="sym">${item.s}</div>
          <div class="cue">${item.w}</div>
        </div>
      `;
    }).join('');

    return `
      <article class="trick-card">
        <div class="trick-header">
          <span class="group-title">${title}</span>
          <span class="block-badge badge-${t.block}">${t.block}-Block</span>
        </div>
        <div class="trick-banner">
          <div class="trick-main">“${t.trick_hi}”</div>
          <div class="trick-roman">${t.trick_roman}</div>
          <div class="trick-alt">${i18n[lang].altPrefix}${t.alt_trick}</div>
        </div>
        <div class="breakdown-grid">${cardsHtml}</div>
      </article>
    `;
  }).join('');

  return filtered.length;
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const filtered = ELEMENTS.filter(matchesElement);
  if (filtered.length === 0) {
    grid.innerHTML = '';
    return 0;
  }
  grid.innerHTML = filtered.map(el => {
    const primaryName = lang === 'hi' ? el.hi : el.en;
    const secondaryName = lang === 'hi' ? el.en : el.hi;
    return `
      <div class="el-card" onclick="openDetail('${el.sym}')">
        <div class="el-symbol-box el-${el.block}">
          <small>${el.z}</small>
          <span>${el.sym}</span>
        </div>
        <div class="el-info">
          <div class="el-name">${primaryName}</div>
          <div class="el-sub">${secondaryName} • ${el.mass} u</div>
          <div class="el-sub" style="font-weight:700;">${el.block}-Block • G${el.group}</div>
        </div>
      </div>
    `;
  }).join('');
  return filtered.length;
}

function renderGrid() {
  const container = document.getElementById('ptableGrid');
  let html = '';

  // Main table rows 1 to 7
  for (let p = 1; p <= 7; p++) {
    for (let g = 1; g <= 18; g++) {
      // Lanthanoid / Actinoid placeholders in Group 3, Period 6 & 7
      if (p === 6 && g === 3) {
        html += `<div class="pt-cell el-f" style="opacity:0.85;cursor:default;"><div class="pt-z">57–71</div><div class="pt-sym">La–Lu</div><div class="pt-nm">4f</div></div>`;
        continue;
      }
      if (p === 7 && g === 3) {
        html += `<div class="pt-cell el-f" style="opacity:0.85;cursor:default;"><div class="pt-z">89–103</div><div class="pt-sym">Ac–Lr</div><div class="pt-nm">5f</div></div>`;
        continue;
      }

      const el = ELEMENTS.find(e => e.period === p && e.group === g && !(e.z >= 57 && e.z <= 71) && !(e.z >= 89 && e.z <= 103));
      if (!el) {
        html += `<div></div>`;
      } else {
        const dimmed = (activeBlock !== 'all' && el.block !== activeBlock) || (query && !matchesElement(el));
        html += `
          <div class="pt-cell el-${el.block}" style="${dimmed ? 'opacity:0.22;' : ''}" onclick="openDetail('${el.sym}')">
            <div class="pt-z">${el.z}</div>
            <div class="pt-sym">${el.sym}</div>
            <div class="pt-nm">${lang === 'hi' ? el.hi : el.en}</div>
          </div>
        `;
      }
    }
  }

  html += `<div class="pt-spacer"></div>`;

  // Lanthanoids row (57 to 71)
  html += `<div class="pt-label">Lanthanoids (4f)</div>`;
  html += `<div></div>`;
  for (let z = 57; z <= 71; z++) {
    const el = ELEMENTS.find(e => e.z === z);
    const dimmed = (activeBlock !== 'all' && el.block !== activeBlock) || (query && !matchesElement(el));
    html += `
      <div class="pt-cell el-f" style="${dimmed ? 'opacity:0.22;' : ''}" onclick="openDetail('${el.sym}')">
        <div class="pt-z">${el.z}</div>
        <div class="pt-sym">${el.sym}</div>
        <div class="pt-nm">${lang === 'hi' ? el.hi : el.en}</div>
      </div>
    `;
  }

  // Actinoids row (89 to 103)
  html += `<div class="pt-label">Actinoids (5f)</div>`;
  html += `<div></div>`;
  for (let z = 89; z <= 103; z++) {
    const el = ELEMENTS.find(e => e.z === z);
    const dimmed = (activeBlock !== 'all' && el.block !== activeBlock) || (query && !matchesElement(el));
    html += `
      <div class="pt-cell el-f" style="${dimmed ? 'opacity:0.22;' : ''}" onclick="openDetail('${el.sym}')">
        <div class="pt-z">${el.z}</div>
        <div class="pt-sym">${el.sym}</div>
        <div class="pt-nm">${lang === 'hi' ? el.hi : el.en}</div>
      </div>
    `;
  }

  container.innerHTML = html;
  return 118;
}

function renderAll() {
  let count = 0;
  if (activeTab === 'tricks') count = renderTricks();
  else if (activeTab === 'cards') count = renderCards();
  else count = renderGrid();

  document.getElementById('emptyState').classList.toggle('hidden', count > 0);
}

function openDetail(sym) {
  const el = elBySym[sym];
  if (!el) return;
  const badge = document.getElementById('mBadge');
  badge.className = `modal-badge el-${el.block}`;
  document.getElementById('mZ').textContent = el.z;
  document.getElementById('mSym').textContent = el.sym;
  document.getElementById('mName').textContent = lang === 'hi' ? el.hi : el.en;
  document.getElementById('mSubName').textContent = lang === 'hi' ? el.en : el.hi;
  document.getElementById('mMass').textContent = `${el.mass} u`;
  document.getElementById('mBlockGroup').textContent = `${el.block}-Block • Group ${el.group} • Period ${el.period}`;
  document.getElementById('mConfig').textContent = el.config;

  const tr = trickBySym[sym];
  const trickBox = document.getElementById('mTrickBox');
  if (tr) {
    trickBox.style.display = 'block';
    document.getElementById('mTrickText').textContent = `“${tr.trick_hi}”`;
    document.getElementById('mTrickRoman').textContent = tr.trick_roman;
  } else {
    trickBox.style.display = 'none';
  }

  document.getElementById('detailModal').classList.add('open');
}

function closeModal(e) {
  if (e.target.id === 'detailModal') forceCloseModal();
}

function forceCloseModal() {
  document.getElementById('detailModal').classList.remove('open');
}

// Initial render
renderAll();
</script>
</body>
</html>
