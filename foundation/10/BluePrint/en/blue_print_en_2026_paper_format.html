<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Format - Exam Blueprint & Syllabus</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --science-color: #10b981;
            --sst-color: #f59e0b;
            --hindi-color: #ef4444;
            --english-color: #3b82f6;
            --sanskrit-color: #8b5cf6;
            --format-color: #ec4899;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-left: 5px solid var(--primary-color);
        }

        .card.science { border-left-color: var(--science-color); }
        .card.sst { border-left-color: var(--sst-color); }
        .card.hindi { border-left-color: var(--hindi-color); }
        .card.english { border-left-color: var(--english-color); }
        .card.sanskrit { border-left-color: var(--sanskrit-color); }
        .card.format { border-left-color: var(--format-color); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .total-badge {
            background: #e0e7ff;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .science .total-badge { background: #d1fae5; color: #047857; }
        .sst .total-badge { background: #fef3c7; color: #b45309; }
        .hindi .total-badge { background: #fee2e2; color: #991b1b; }
        .english .total-badge { background: #dbeafe; color: #1e40af; }
        .sanskrit .total-badge { background: #ede9fe; color: #5b21b6; }
        .format .total-badge { background: #fce7f3; color: #be185d; }

        ul {
            margin: 0;
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        li span {
            font-weight: 600;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Paper Format Breakdown</h1>

    <div class="card format">
        <div class="card-header">
            📝 Paper Format Breakdown
            <span class="total-badge">Structure</span>
        </div>
        <ul>
            <li><span>Objective Type (~30 Marks):</span> MCQs, Fill in the blanks, True/False, Match columns.</li>
            <li><span>Short Answer (2 Marks Each):</span> Concise answers up to 30 words.</li>
            <li><span>Long Answer (3-4 Marks Each):</span> Detailed descriptions & step-by-step solutions.</li>
        </ul>
    </div>

</div>

</body>
</html>
