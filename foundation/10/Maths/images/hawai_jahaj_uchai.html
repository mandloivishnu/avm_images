<div style="width:100%; max-width:700px; margin:0 auto; font-family:'Noto Sans Devanagari', Arial, sans-serif; background:#eaf6ff; border-radius:12px; padding:16px; box-sizing:border-box;">
  <h3 style="text-align:center; color:#1a1a1a; margin:4px 0 12px;">हवाई जहाज़ की ऊँचाई ज्ञात करना</h3>
  <svg viewBox="0 0 700 380" style="width:100%; height:auto; display:block; background:linear-gradient(#cfe9ff,#eaf6ff);" xmlns="http://www.w3.org/2000/svg">
    <!-- Ground -->
    <rect x="0" y="330" width="700" height="50" fill="#cdeccd"/>
    <line x1="0" y1="330" x2="700" y2="330" stroke="#4a7a4a" stroke-width="2"/>

    <!-- Observer -->
    <circle cx="100" cy="310" r="10" fill="#e07a30"/>
    <rect x="93" y="320" width="14" height="14" fill="#e07a30"/>
    <text x="100" y="355" text-anchor="middle" font-size="15" fill="#333">प्रेक्षक (Observer)</text>

    <!-- Horizontal reference -->
    <line x1="100" y1="310" x2="640" y2="310" stroke="#888" stroke-dasharray="6,4" stroke-width="2"/>

    <!-- Line of sight to plane (animated rotation via group) -->
    <g id="sightGroup">
      <line id="sightLine" x1="100" y1="310" x2="480" y2="90" stroke="#1a73c7" stroke-width="2.5"/>
    </g>

    <!-- angle arc -->
    <path id="angleArc" d="M 150 310 A 50 50 0 0 0 128 264" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text id="angleLabel" x="165" y="290" font-size="16" fill="#c0392b">θ</text>

    <!-- Height guide line (dashed vertical from plane to ground) -->
    <line id="heightLine" x1="480" y1="90" x2="480" y2="310" stroke="#999" stroke-dasharray="4,4" stroke-width="1.5"/>

    <!-- Airplane group, animated along a path -->
    <g id="plane">
      <path d="M0,0 L40,-4 L55,0 L40,4 Z" fill="#333"/>
      <path d="M15,-2 L5,-16 L12,-16 L22,-2 Z" fill="#333"/>
      <path d="M15,2 L5,16 L12,16 L22,2 Z" fill="#333"/>
      <path d="M40,-2 L48,-10 L52,-10 L46,-2 Z" fill="#333"/>
    </g>

    <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">उड़ान ऊँचाई का अनुमान</text>
  </svg>
  <p style="text-align:center; color:#555; font-size:14px; margin-top:8px;">tan θ = ऊँचाई / क्षैतिज दूरी &nbsp;—&nbsp; जैसे-जैसे जहाज़ आगे बढ़ता है, उन्नयन कोण θ बदलता रहता है।</p>
</div>

<script>
(function(){
  var plane = document.getElementById('plane');
  var sightLine = document.getElementById('sightLine');
  var angleArc = document.getElementById('angleArc');
  var angleLabel = document.getElementById('angleLabel');
  var heightLine = document.getElementById('heightLine');

  var obsX = 100, obsY = 310;
  var t = 0;

  function frame(){
    t += 0.008;
    if (t > 1) t = 0;
    // Plane path: moves from x=420 to x=620 at height oscillating slightly, simulating level flight
    var px = 420 + t * 200;
    var py = 90 + Math.sin(t * Math.PI) * -10;

    plane.setAttribute('transform', 'translate(' + px + ',' + py + ') rotate(0)');

    sightLine.setAttribute('x2', px);
    sightLine.setAttribute('y2', py);

    heightLine.setAttribute('x1', px);
    heightLine.setAttribute('x2', px);
    heightLine.setAttribute('y1', py);

    // angle arc radius calc
    var dx = px - obsX, dy = obsY - py;
    var angle = Math.atan2(dy, dx);
    var r = 50;
    var ax = obsX + r * Math.cos(angle * 0.9);
    var ay = obsY - r * Math.sin(angle * 0.9);
    angleArc.setAttribute('d', 'M ' + (obsX + r) + ' ' + obsY + ' A ' + r + ' ' + r + ' 0 0 0 ' + ax.toFixed(1) + ' ' + ay.toFixed(1));
    angleLabel.setAttribute('x', obsX + 65);
    angleLabel.setAttribute('y', obsY - 20);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
