<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans Devanagari, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="450" fill="#fff7e6"/>
  <rect x="0" y="400" width="700" height="50" fill="#cdeccd"/>
  <line x1="0" y1="400" x2="700" y2="400" stroke="#4a7a4a" stroke-width="2"/>

  <!-- Tower -->
  <rect x="500" y="80" width="50" height="320" fill="#9aa5b1" stroke="#5b6672" stroke-width="2"/>
  <polygon points="500,80 550,80 525,50" fill="#7c8794" stroke="#5b6672" stroke-width="2"/>
  <text x="525" y="35" text-anchor="middle" font-size="18" fill="#333">मीनार</text>

  <!-- Height label (h) -->
  <line x1="470" y1="80" x2="470" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="463" y1="80" x2="477" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="463" y1="400" x2="477" y2="400" stroke="#333" stroke-width="1.5"/>
  <text x="445" y="245" text-anchor="middle" font-size="18" fill="#333" transform="rotate(-90 445 245)">ऊँचाई h</text>

  <!-- Observer -->
  <circle cx="100" cy="380" r="10" fill="#e07a30"/>
  <rect x="93" y="390" width="14" height="14" fill="#e07a30"/>
  <text x="100" y="420" text-anchor="middle" font-size="15" fill="#333">प्रेक्षक</text>

  <!-- Ground distance -->
  <line x1="100" y1="400" x2="500" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="393" x2="100" y2="407" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="393" x2="500" y2="407" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="425" text-anchor="middle" font-size="18" fill="#333">दूरी d</text>

  <!-- Horizontal reference -->
  <line x1="100" y1="380" x2="500" y2="380" stroke="#888" stroke-dasharray="6,4" stroke-width="2"/>

  <!-- Line of sight -->
  <line x1="100" y1="380" x2="500" y2="85" stroke="#1a73c7" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- angle arc -->
  <path d="M 150 380 A 50 50 0 0 0 132 332" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="165" y="365" font-size="17" fill="#c0392b">θ (उन्नयन कोण)</text>

  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">मीनार की ऊँचाई ज्ञात करना</text>
  <text x="350" y="440" text-anchor="middle" font-size="15" fill="#555">tan θ = h / d</text>
</svg>
