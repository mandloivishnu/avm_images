<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans Devanagari, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="480" fill="#eaf6ff"/>

  <!-- Ground -->
  <rect x="0" y="440" width="800" height="40" fill="#cdeccd"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#4a7a4a" stroke-width="2"/>

  <!-- Building / Tower -->
  <rect x="530" y="90" width="80" height="350" fill="#9aa5b1" stroke="#5b6672" stroke-width="2"/>
  <rect x="545" y="110" width="15" height="20" fill="#eaf6ff" stroke="#5b6672"/>
  <rect x="580" y="110" width="15" height="20" fill="#eaf6ff" stroke="#5b6672"/>
  <rect x="545" y="150" width="15" height="20" fill="#eaf6ff" stroke="#5b6672"/>
  <rect x="580" y="150" width="15" height="20" fill="#eaf6ff" stroke="#5b6672"/>
  <text x="570" y="70" text-anchor="middle" font-size="18" fill="#333">मीनार / भवन</text>

  <!-- Observer on ground -->
  <circle cx="110" cy="415" r="10" fill="#e07a30"/>
  <rect x="103" y="425" width="14" height="15" fill="#e07a30"/>
  <text x="110" y="460" text-anchor="middle" font-size="15" fill="#333">प्रेक्षक</text>

  <!-- Horizontal reference line from ground observer eye -->
  <line x1="110" y1="415" x2="530" y2="415" stroke="#888" stroke-dasharray="6,4" stroke-width="2"/>

  <!-- Line of sight (elevation) from observer to top of building -->
  <line x1="110" y1="415" x2="530" y2="95" stroke="#1a73c7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Angle arc for elevation -->
  <path d="M 155 415 A 45 45 0 0 0 137 373" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="400" font-size="16" fill="#c0392b">उन्नयन कोण θ</text>

  <!-- Person on top of building -->
  <circle cx="570" cy="80" r="9" fill="#2e8b57"/>
  <rect x="564" y="89" width="12" height="13" fill="#2e8b57"/>

  <!-- Horizontal reference line from top of building -->
  <line x1="570" y1="80" x2="760" y2="80" stroke="#888" stroke-dasharray="6,4" stroke-width="2"/>

  <!-- Line of sight (depression) from top of building to car -->
  <line x1="570" y1="80" x2="740" y2="430" stroke="#1a73c7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Angle arc for depression -->
  <path d="M 615 80 A 45 45 0 0 1 605 124" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="600" y="115" font-size="16" fill="#c0392b">अवनमन कोण θ</text>

  <!-- Car on ground -->
  <rect x="715" y="418" width="50" height="20" rx="4" fill="#333"/>
  <circle cx="725" cy="440" r="6" fill="#111"/>
  <circle cx="755" cy="440" r="6" fill="#111"/>
  <text x="740" y="465" text-anchor="middle" font-size="15" fill="#333">वस्तु</text>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">उन्नयन कोण एवं अवनमन कोण (Angle of Elevation &amp; Depression)</text>
</svg>
