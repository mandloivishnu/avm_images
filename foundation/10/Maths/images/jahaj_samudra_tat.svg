<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans Devanagari, Arial, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="450" fill="#e6f4ff"/>

  <!-- Sea -->
  <rect x="0" y="380" width="700" height="70" fill="#5aa9e6"/>
  <path d="M0,380 Q20,375 40,380 T80,380 T120,380 T160,380 T200,380 T240,380 T280,380 T320,380 T360,380 T400,380 T440,380 T480,380 T520,380 T560,380 T600,380 T640,380 T680,380 T700,380" fill="none" stroke="#3f8fd1" stroke-width="2"/>

  <!-- Cliff -->
  <polygon points="0,150 150,150 90,380 0,380" fill="#a9977c" stroke="#7a6a52" stroke-width="2"/>
  <text x="60" y="130" text-anchor="middle" font-size="18" fill="#333">चट्टान / तट (Cliff)</text>

  <!-- Observer on cliff -->
  <circle cx="120" cy="135" r="9" fill="#2e8b57"/>
  <rect x="114" y="144" width="12" height="13" fill="#2e8b57"/>

  <!-- Height of cliff -->
  <line x1="30" y1="150" x2="30" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="23" y1="150" x2="37" y2="150" stroke="#333" stroke-width="1.5"/>
  <line x1="23" y1="380" x2="37" y2="380" stroke="#333" stroke-width="1.5"/>
  <text x="10" y="270" text-anchor="middle" font-size="16" fill="#333" transform="rotate(-90 10 270)">ऊँचाई h</text>

  <!-- Horizontal reference from observer -->
  <line x1="120" y1="135" x2="620" y2="135" stroke="#888" stroke-dasharray="6,4" stroke-width="2"/>

  <!-- Line of sight to ship -->
  <line x1="120" y1="135" x2="600" y2="395" stroke="#1a73c7" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- angle arc (depression) -->
  <path d="M 175 135 A 55 55 0 0 1 165 187" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="160" y="175" font-size="16" fill="#c0392b">अवनमन कोण θ</text>

  <!-- Ship -->
  <polygon points="560,395 640,395 620,415 580,415" fill="#e07a30" stroke="#7a3d0f" stroke-width="2"/>
  <line x1="600" y1="395" x2="600" y2="365" stroke="#7a3d0f" stroke-width="2"/>
  <polygon points="600,365 625,378 600,385" fill="#f2f2f2" stroke="#7a3d0f"/>
  <text x="600" y="435" text-anchor="middle" font-size="15" fill="#333">जहाज़</text>

  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">जहाज़ से समुद्र तट की दूरी</text>
</svg>
